# Render Blueprint: describes the web service so Render can set it up for you.
# Render dashboard > New > Blueprint > choose this repository.
# Values marked "sync: false" are secrets: Render asks for them once and never stores them in git.
services:
  - type: web
    name: chatgpt-clone
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render runs the app behind one proxy; needed for per-visitor rate limits.
      - key: TRUST_PROXY
        value: "1"
      # A long random secret, generated by Render.
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
